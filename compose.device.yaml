# Opt-in authenticated device API. The website API stays loopback-only.
services:
  livesheet:
    command:
      - --bind
      - 0.0.0.0
      - --storage
      - /data/jobs
      - --native-host
      - ${LIVESHEET_NATIVE_HOST:?Set the Mac private IPv4 address}
      - --native-bind
      - 0.0.0.0
      - --native-name
      - ${LIVESHEET_NATIVE_NAME:?Set the Mac hostname ending in .local}
      - --native-token-file
      - /run/secrets/device-token
    ports:
      - "${LIVESHEET_NATIVE_HOST:?Set the Mac private IPv4 address}:3177:3177"
    volumes:
      - ./data/device-token:/run/secrets/device-token:ro
